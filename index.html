<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none}
:root{--c:#00f0ff;--g:#ffaa22;--w:#fff;--b:#000;--ez:cubic-bezier(.16,1,.3,1)}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Space Mono',monospace;color:#fff;cursor:crosshair}

/* ── Scanlines ── */
.scl{position:fixed;inset:0;z-index:18;pointer-events:none;

.p-orb::before{content:'';position:absolute;inset:10px;border-radius:50%;border:1px solid rgba(255,170,34,.2);animation:ob 3s ease-in-out infinite reverse}
.p-orb::after{content:'';position:absolute;inset:22px;border-radius:50%;background:var(--c);box-shadow:0 0 24px var(--c),0 0 60px rgba(0,240,255,.3)}

/* ── Streak ── */

/* ── Epilogue ── */
#epi{position:fixed;inset:0;z-index:48;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 2.4s ease,visibility 2.4s ease}

#btn-rp:hover{color:#fff;border-color:rgba(255,255,255,.28)}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader }      from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader }     from 'three/addons/loaders/DRACOLoader.js';

/* ════════════════════════════════════════════════════════════
   §0  TIME MAP
════════════════════════════════════════════════════════════ */
const TL = {
  TOTAL:  30.00,
  A1_END:  7.82,   // 第一幕结束
  VAC:     8.00,   // 0.18s 真空
  A2S:     8.00,   // 第二幕开始
  A2E:    13.00,
  A3S:    13.00,   // 第三幕
  A3E:    21.00,
  A4S:    21.00,   // 第四幕
  FADE:   27.20,
};

/* ════════════════════════════════════════════════════════════
   §1  DOM
════════════════════════════════════════════════════════════ */
const g  = id => document.getElementById(id);
const el = {
  cv:    g('cv'),   portal: g('portal'), hud: g('hud'),
  tc:    g('tc'),   prog:   g('prog'),   prose: g('prose'),
  stat:  g('stat'), narr:   g('narr'),   na: g('na'),
  nt:    g('nt'),   nd:     g('nd'),     flash: g('flash'),
  stk:   g('stk'),  epi:    g('epi'),    sds: g('sds'),
  vu:    g('vu'),   lb1:    g('lb1'),    lb2: g('lb2'),
};

const VU = 18;
const vuB = Array.from({length:VU},()=>{ const d=document.createElement('div'); d.className='vb'; el.vu.appendChild(d); return d; });

/* ════════════════════════════════════════════════════════════
   §2  STATE
════════════════════════════════════════════════════════════ */
let playing=false, t0=0, prevAct=-1;
const TR = {vac:false,burst:false,reorg:false,diss:false,epi:false};

/* ════════════════════════════════════════════════════════════
   §3  MOUSE
════════════════════════════════════════════════════════════ */
const mx={x:0,y:0,tx:0,ty:0};
window.addEventListener('mousemove',e=>{
  mx.tx=(e.clientX/innerWidth)*2-1;
  mx.ty=-(e.clientY/innerHeight)*2+1;
});

/* ════════════════════════════════════════════════════════════
   §4  AUDIO ENGINE — 深空禅意声景
════════════════════════════════════════════════════════════ */
class Audio {
  constructor(){ this.ctx=null; this.mst=null; }

  _boot(){
    if(this.ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext;
    this.ctx=new AC();
    // 温和高频货架 EQ（-6dB @ 3.5kHz）
    const eq=this.ctx.createBiquadFilter();
    eq.type='highshelf'; eq.frequency.value=3500; eq.gain.value=-7;
    // Limiter
    const lim=this.ctx.createDynamicsCompressor();
    lim.threshold.value=-5; lim.ratio.value=16;
    lim.attack.value=0.001; lim.release.value=0.1;
    this.mst=this.ctx.createGain(); this.mst.gain.value=0.42;
    this.mst.connect(eq); eq.connect(lim); lim.connect(this.ctx.destination);
  }

  _osc(freq,type,gain,dur,del=0){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain(),t=this.ctx.currentTime+del;
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(gain,t+Math.min(.08,dur*.15));
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(this.mst); o.start(t); o.stop(t+dur+.05);
  }

  act1(){
    this._boot();
    // 深空低频嗡鸣 (36 Hz sine，3s渐入)
    const drn=this.ctx.createOscillator(),dg=this.ctx.createGain(),df=this.ctx.createBiquadFilter();
    drn.type='sine'; drn.frequency.value=36;
    df.type='lowpass'; df.frequency.value=160; df.Q.value=1;
    dg.gain.setValueAtTime(0,this.ctx.currentTime);
    dg.gain.linearRampToValueAtTime(.32,this.ctx.currentTime+3.5);
    drn.connect(df); df.connect(dg); dg.connect(this.mst); drn.start();
    drn.frequency.linearRampToValueAtTime(48,this.ctx.currentTime+TL.A1_END);
    this._drone=drn; this._droneGain=dg;

    // Shepard升音（5层，低增益）
    for(let i=0;i<5;i++){
      const f=55*Math.pow(2,i), env=Math.sin(((i+.5)/5)*Math.PI);
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      o.frequency.linearRampToValueAtTime(f*2,this.ctx.currentTime+TL.A1_END);
      g.gain.value=.016*env;
      o.connect(g); g.connect(this.mst); o.start(); o.stop(this.ctx.currentTime+TL.A1_END+.5);
    }

    // 心跳（58→105 BPM，低音量）
    let bpm=58;
    const hb=()=>{
      if(!playing)return;
      const el=(performance.now()-t0)/1000;
      if(el>=TL.A1_END)return;
      bpm=58+(el/TL.A1_END)*47;
      this._heartbeat(.10+(el/TL.A1_END)*.08);
      this._hbTimer=setTimeout(hb,(60/bpm)*1000);
    };
    setTimeout(hb,900);
  }

  _heartbeat(v){
    const o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type='sine'; o.frequency.setValueAtTime(48,this.ctx.currentTime);
    o.frequency.exponentialRampToValueAtTime(18,this.ctx.currentTime+.24);
    g.gain.setValueAtTime(v,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+.3);
    o.connect(g); g.connect(this.mst); o.start(); o.stop(this.ctx.currentTime+.35);
  }

  vacuum(){
    if(!this.ctx)return;
    clearTimeout(this._hbTimer);
    this.mst.gain.cancelScheduledValues(this.ctx.currentTime);
    this.mst.gain.linearRampToValueAtTime(0,this.ctx.currentTime+.1);
  }

  burst(){
    if(!this.ctx)return;
    this.mst.gain.setValueAtTime(0,this.ctx.currentTime);
    this.mst.gain.linearRampToValueAtTime(.48,this.ctx.currentTime+.15);
    // Sub 冲击
    const s=this.ctx.createOscillator(),sg=this.ctx.createGain();
    s.type='sine'; s.frequency.setValueAtTime(36,this.ctx.currentTime);
    s.frequency.exponentialRampToValueAtTime(14,this.ctx.currentTime+.9);
    sg.gain.setValueAtTime(.7,this.ctx.currentTime);
    sg.gain.exponentialRampToValueAtTime(.0001,this.ctx.currentTime+1.2);
    s.connect(sg); sg.connect(this.mst); s.start(); s.stop(this.ctx.currentTime+1.3);
    // 带通噪声（空间破碎感，500~1200Hz，温和）
    const bl=this.ctx.sampleRate*.6,buf=this.ctx.createBuffer(1,bl,this.ctx.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<bl;i++) d[i]=(Math.random()*2-1)*Math.exp(-i/(bl*.38));
    const ns=this.ctx.createBufferSource(),bp=this.ctx.createBiquadFilter(),ng=this.ctx.createGain();
    bp.type='bandpass'; bp.frequency.value=640; bp.Q.value=.7;
    ng.gain.value=.18; ns.buffer=buf;
    ns.connect(bp); bp.connect(ng); ng.connect(this.mst); ns.start();
    // 空间残响（sine，五度程和弦）
    [220,330,440,660].forEach((f,i)=>{
      const del=i*.08;
      this._osc(f,'sine',.042/(i+1),2.2+i*.5,del);
    });
  }

  act3(){
    if(!this.ctx)return;
    // 五声音阶 Pad（D 宫，低音量，错开进入）
    [146,220,293,440,587].forEach((f,i)=>{
      this._osc(f,'sine',.022/(i*.25+1),7.5+i*.3,i*.55);
    });
  }

  act4(){
    if(!this.ctx)return;
    // 纯律颂钵（慢渐入，长拖尾）
    [216,324,432,528].forEach((f,i)=>{
      const o=this.ctx.createOscillator(),g=this.ctx.createGain();
      o.type='sine'; o.frequency.value=f;
      const t=this.ctx.currentTime+i*.9;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.052,t+1);
      g.gain.exponentialRampToValueAtTime(.0001,t+9);
      o.connect(g); g.connect(this.mst); o.start(t); o.stop(t+10);
    });
  }

  fade(d=3.8){ if(!this.ctx||!this.mst)return; this.mst.gain.linearRampToValueAtTime(0,this.ctx.currentTime+d); }
}
const audio=new Audio();

/* ════════════════════════════════════════════════════════════
   §6  PMREM IBL — 摄影棚级高反差环境贴图
════════════════════════════════════════════════════════════ */
(function buildIBL(){
  const pm=new THREE.PMREMGenerator(renderer);
  pm.compileEquirectangularShader();
  const W=1024,H=512,cv=document.createElement('canvas');
  cv.width=W; cv.height=H;
  const c=cv.getContext('2d');
  c.fillStyle='#010408'; c.fillRect(0,0,W,H);
  // 顶部软光箱
  const t=c.createLinearGradient(0,0,0,H*.44);
  t.addColorStop(0,'rgba(255,255,255,.90)'); t.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=t; c.fillRect(55,0,W-110,H*.5);
  // 左侧青蓝轮廓
  const l=c.createRadialGradient(100,H/2,5,100,H/2,260);
  l.addColorStop(0,'rgba(0,240,255,.95)'); l.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=l; c.fillRect(0,20,420,H-40);

  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float uTime,uCA,uGrain,uVig;varying vec2 vUv;
    float rnd(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
    void main(){
      vec2 uv=vUv,d=uv-.5;float dist=length(d);
      vec2 of=normalize(d)*dist*dist*uCA;
      float r=texture2D(tDiffuse,uv-of*1.05).r;
      float gch=texture2D(tDiffuse,uv).g;
      float b=texture2D(tDiffuse,uv+of*.95).b;
      vec3 col=vec3(r,gch,b);
      col+=(rnd(uv+fract(uTime*29.3))-.5)*uGrain;
      col*=1.-smoothstep(.38,1.28,dist*uVig*2.);
      gl_FragColor=vec4(col,1.);
    }`
};

function makePts(count,rMin,rMax,size,col,opa){
  const g=new THREE.BufferGeometry(),p=new Float32Array(count*3);
  for(let i=0;i<count;i++){
    const phi=Math.acos(2*Math.random()-1),th=Math.random()*Math.PI*2;
    const r=rMin+Math.random()*(rMax-rMin);
    p[i*3]=r*Math.sin(phi)*Math.cos(th);
    p[i*3+1]=r*Math.sin(phi)*Math.sin(th);
    p[i*3+2]=r*Math.cos(phi);
  }
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  const m=new THREE.PointsMaterial({color:col,size,transparent:true,opacity:opa,blending:THREE.AdditiveBlending,depthWrite:false});
  return new THREE.Points(g,m);
}

/* ════════════════════════════════════════════════════════════
   §10  PLASMA CORE SHADER — 自定义等离子体球
════════════════════════════════════════════════════════════ */
const plasmaVS=`
  uniform float uT;uniform float uStr;
  varying vec3 vN;varying vec3 vWP;varying float vNs;
  float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
  float ns(vec3 x){
    vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);
    return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);
  }
  float fbm(vec3 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*ns(p);p=p*2.1+vec3(1.7,9.2,8.3);a*=.5;}return v;}
  void main(){
    float n=fbm(position*2.2+uT*.38)+fbm(position*4.4-uT*.22)*.35;
    vNs=n;
    vec3 disp=position+normal*n*uStr;
    vN=normalize(normalMatrix*normal);
    vWP=(modelMatrix*vec4(disp,1.)).xyz;
    gl_Position=projectionMatrix*modelViewMatrix*vec4(disp,1.);
  }
`;
const plasmaFS=`
  uniform float uT,uInt;uniform vec3 uCA,uCB,uCC;
  varying vec3 vN;varying vec3 vWP;varying float vNs;
  void main(){
    vec3 vd=normalize(cameraPosition-vWP);
    float fr=pow(1.-max(dot(vd,vN),0.),2.8);
    vec3 col=mix(uCA,uCB,vNs);
    col=mix(col,uCC,fr*.75);
    float pulse=1.+sin(uT*2.6)*.18;
    gl_FragColor=vec4(col*uInt*pulse,1.);
  }
`;
const plasmaUniforms={
  uT:{value:0},uStr:{value:.18},uInt:{value:3.8},
  uCA:{value:new THREE.Color(0x00e8ff)},
  uCB:{value:new THREE.Color(0x0028ff)},
  uCC:{value:new THREE.Color(0xffffff)},
};
const plasmaMat=new THREE.ShaderMaterial({vertexShader:plasmaVS,fragmentShader:plasmaFS,uniforms:plasmaUniforms});

    new THREE.OctahedronGeometry(.24,0),

  const MAT_KIN=new THREE.MeshStandardMaterial({color:0x0e0900,emissive:new THREE.Color(0xffaa22),emissiveIntensity:3.8,metalness:.97,roughness:.13,envMapIntensity:2.8});

  for(let i=0;i<SHARD_N;i++){
    const geo=GEOS[i%3];

      mR,mA,mSpd:(trk===0?.016:-.011)*(0.8+Math.random()*.4),mY:(Math.random()-.5)*.6,

    const p=new THREE.Mesh(pilGeo,pillarMat);

}

let recoil=0;
const camBase=new THREE.Vector3();

function setAct(a){
  if(a===prevAct)return; prevAct=a;
  document.querySelectorAll('.sd').forEach((d,i)=>d.classList.toggle('act',i===a));
}
function narr(act,title,desc,show){
  el.na.textContent=act; el.nt.textContent=title; el.nd.textContent=desc;
  el.narr.classList.toggle('on',show);
}

function direct(t){
  // HUD 更新
  const s=Math.min(t,30).toFixed(2).padStart(5,'0');
  el.tc.textContent=`${s} / 30.00`;
  el.prog.style.setProperty('--p',`${(t/TL.TOTAL)*100}%`);

  /* ─────────────────────────────────────────────
     ACT I  执 · 囚笼   0 ~ 7.82s
  ───────────────────────────────────────────── */
  if(t<TL.A1_END){
    setAct(0);
    const p=t/TL.A1_END;
    // 摄像机缓慢逼近 + 轻微横向漂移 + 呼吸式FOV
    camera.position.z=16-Math.pow(p,1.55)*8.5;
    camera.position.y=.6-p*.3+Math.sin(t*.9)*.12;
    camera.position.x=Math.sin(t*.34)*.45;
    camera.fov=36-p*3; camera.updateProjectionMatrix();
    // 囚笼扭动与红光急促脉搏
    if(cageGrp){
      cageGrp.rotation.y+=.013+p*.024;
      cageGrp.rotation.x+=.008+p*.016;
      cageGrp.rotation.z+=.004+p*.008;
      cageGrp.children[0].material.emissiveIntensity=.3+Math.sin(t*(3.5+p*11))*(0.22+p*.9);
      cageGrp.children[2].material.emissiveIntensity=.6+Math.sin(t*(6+p*14))*(0.3+p*1.2);
    }
    bloom.strength=1.7+Math.sin(t*2.2)*.28;
    film.uniforms.uCA.value=.002+p*.0045;

    const show=t>1.2&&t<6.5;
    narr('ACT I · THE COCOON','执 · 囚 笼','万物附骨 · 禁锢重压 · 窒息坍缩',show);
    if(show) el.prose.textContent='执念如囚 · 杂质繁冗 · 压制神明';
  }

  /* ─────────────────────────────────────────────
     VACUUM  7.82 ~ 8.00s
  ───────────────────────────────────────────── */
  if(t>=TL.A1_END&&t<TL.VAC&&!TR.vac){
    TR.vac=true; audio.vacuum();
    bloom.strength=.4; coreLight.intensity=.8;
    film.uniforms.uCA.value=.0008;
    el.narr.classList.remove('on');
  }

  /* ─────────────────────────────────────────────
     ACT II  断 · 爆裂   8 ~ 13s
  ───────────────────────────────────────────── */
  if(t>=TL.A2S&&!TR.burst){
    TR.burst=true; setAct(1);
    audio.burst();
    el.flash.style.transition='opacity .04s ease-out';
    el.flash.style.opacity='1';
    setTimeout(()=>{ el.flash.style.transition='opacity .55s ease-out'; el.flash.style.opacity='0'; },55);
    // 隐藏囚笼实体（碎片留在原位继续飞）
    if(cageGrp){
      cageGrp.children[0].visible=false;
      cageGrp.children[1].visible=false;
      cageGrp.children[2].visible=false;
    }
    // 将碎片从 cageGrp 转移到 scene，保持世界坐标
    shards.forEach(s=>{
      cageGrp&&cageGrp.remove(s);
      scene.add(s);
    });
    bloom.strength=7.5; coreLight.intensity=35; coreLight.color.set(0xffffff);
    film.uniforms.uCA.value=.048;
    el.stk.classList.add('on');
    recoil=.65;
    camera.fov=36; camera.updateProjectionMatrix();
    // 激活触须
    tendrilGrp.children.forEach(t2=>{ t2.material.opacity=0; });
  }

  if(t>=TL.A2S&&t<TL.A2E){
    setAct(1);
    const bT=t-TL.A2S; // 0~5s

    // 核心展开
    if(sacredGrp){
      const sc=Math.min(1,bT*1.4); sacredGrp.scale.set(sc,sc,sc);
    }
    coreLight.color.lerpColors(new THREE.Color(0xffffff),new THREE.Color(0x00f0ff),Math.min(1,bT/2.8));

    // 激波三环
    [sw1,sw2,sw3].forEach((r,i)=>{
      const spd=[5.8,4.2,3.0][i]; const dur=[1.5,2.0,2.6][i];
      r.scale.set(bT*spd,bT*spd,1);
      r.material.opacity=Math.max(0,1.-bT/dur);
    });

    // 体积光柱淡入
    rayMat.opacity=Math.min(.11,bT*.06);
    rayGrp.rotation.y+=.01;

    // 触须渐现
    if(bT>0.5){
      const to=Math.min(.55,(bT-.5)*.25);
      tendrilGrp.children.forEach(m=>m.material.opacity=to);
    }

    // 镜头后撤 + 仰角 + 环绕
    camera.position.z=7.5+bT*.85;
    camera.position.y=.2+bT*.32;
    camera.position.x=Math.sin(bT*.6)*2.2;

    bloom.strength=THREE.MathUtils.lerp(bloom.strength,2.4,.05);
    film.uniforms.uCA.value=THREE.MathUtils.lerp(film.uniforms.uCA.value,.003,.04);

    // 碎片向外飞散（保存快照）
    shards.forEach(s=>{
      const v=s.userData.bv,sp=s.userData.spin;
      s.position.x=s.userData.origin.x+v.x*bT;
      s.position.y=s.userData.origin.y+v.y*bT;
      s.position.z=s.userData.origin.z+v.z*bT;
      s.userData.snap.copy(s.position);
      s.rotation.x+=sp.x*.013; s.rotation.y+=sp.y*.013; s.rotation.z+=sp.z*.013;
    });

    const show=bT>.8&&bT<4.;
    narr('ACT II · THE SHATTERING','断 · 爆 裂','一念舍弃 · 囚笼崩解 · 神明破茧',show);
    if(show) el.prose.textContent='破执碎壳 · 初露真容 · 舍尽杂相';
  }

  /* ─────────────────────────────────────────────
     ACT III  舍 · 曼陀罗重构   13 ~ 21s
  ───────────────────────────────────────────── */
  if(t>=TL.A3S&&!TR.reorg){
    TR.reorg=true; setAct(2);
    audio.act3();
    el.flash.style.background='radial-gradient(ellipse at 50% 50%,#ffe890 0%,#00f0ff 40%,rgba(0,0,0,0) 78%)';
    el.flash.style.transition='opacity .1s ease-out';
    el.flash.style.opacity='.4';
    setTimeout(()=>{ el.flash.style.transition='opacity .55s ease-out'; el.flash.style.opacity='0'; },130);
    bloom.strength=3.2; coreLight.intensity=9.;
    el.stk.classList.remove('on');
    aux.intensity=3.5;
    // 触须颜色变金
    tendrilGrp.children.forEach(m=>m.material.color.set(0xffbb33));
  }

  if(t>=TL.A3S&&t<TL.A3E){
    setAct(2);
    const rT=t-TL.A3S;
    const rP=Math.min(1,rT/4.); // 4s完成入轨

    bloom.strength=THREE.MathUtils.lerp(bloom.strength,1.95,.03);
    aux.intensity=THREE.MathUtils.lerp(aux.intensity,2.2,.02);

    // 大弧度升降臂环绕（穿越星环的crane shot）
    const oa=(rT/8.)*Math.PI*.72;
    camera.position.x=Math.sin(oa)*7.8;
    camera.position.z=Math.cos(oa)*7.8;
    camera.position.y=1.2+Math.sin(rT*.42)*1.3;
    camera.fov=THREE.MathUtils.lerp(camera.fov,40,.015);
    camera.updateProjectionMatrix();

    // 天球仪加速自转
    astroRings.forEach(r=>{ r.rotation.x+=r.userData.rx*2.1; r.rotation.y+=r.userData.ry*2.1; });

    // 触须旋转
    tendrilGrp.rotation.y+=.015;
    tendrilGrp.children.forEach(m=>m.material.opacity=THREE.MathUtils.lerp(m.material.opacity,.4,.04));

    // 碎片吸附入曼陀罗轨道
    shards.forEach(s=>{
      s.userData.mA+=s.userData.mSpd;
      const tx=Math.cos(s.userData.mA)*s.userData.mR;
      const tz=Math.sin(s.userData.mA)*s.userData.mR;
      const ty=s.userData.mY;
      s.position.x=THREE.MathUtils.lerp(s.userData.snap.x,tx,rP);
      s.position.y=THREE.MathUtils.lerp(s.userData.snap.y,ty,rP);
      s.position.z=THREE.MathUtils.lerp(s.userData.snap.z,tz,rP);
      s.rotation.y+=.016;
    });

    const show=rT>.7&&rT<6.5;
    narr('ACT III · THE MANDALA','舍 · 重 构','碎而生序 · 杂相归位 · 曼陀罗星轨',show);
    if(show) el.prose.textContent='舍其纷扰 · 聚散有序 · 万物各得其位';
  }

  /* ─────────────────────────────────────────────
     ACT IV  离 · 升华归虚   21 ~ 30s
  ───────────────────────────────────────────── */
  if(t>=TL.A4S&&!TR.diss){
    TR.diss=true; setAct(3);
    audio.act4();
    bloom.strength=5.;
    el.lb1.classList.add('wide'); el.lb2.classList.add('wide');
    coreLight.intensity=6.;
    // 触须缓慢消隐
    tendrilGrp.children.forEach(m=>m.material.color.set(0xffffff));
    aux.intensity=0;
    plasmaUniforms.uCA.value.set(0xffffff);
    plasmaUniforms.uCB.value.set(0xaaddff);
    plasmaUniforms.uCC.value.set(0xffffff);
  }

  if(t>=TL.A4S){
    setAct(3);
    const dT=t-TL.A4S;

    // 光柱点亮
    if(pillarMat) pillarMat.opacity=Math.min(.42,dT*.12);
    pillarGrp?.children.forEach(p=>{ p.position.y+=p.userData.spd; if(p.position.y>14) p.position.y=-8; });

    // 触须渐消
    tendrilGrp.children.forEach(m=>m.material.opacity=Math.max(0,m.material.opacity*.985));

    // 镜头仰望天顶，缓慢上升
    camera.position.z=6.8+dT*.3;
    camera.position.y=2.+dT*.18;
    camera.position.x=Math.sin(dT*.26)*1.8;
    camera.fov=THREE.MathUtils.lerp(camera.fov,50,.01);
    camera.updateProjectionMatrix();

    // 碎片消融上升
    shards.forEach(s=>{ s.position.y+=.052; const sc=Math.max(.001,s.scale.x*.988); s.scale.set(sc,sc,sc); });
    // 核心收敛
    if(sacredGrp){ const sc=Math.max(.001,1.-dT*.14); sacredGrp.scale.set(sc,sc,sc); }
    // 等离子脉动增强
    plasmaUniforms.uInt.value=3.8+dT*.2;

    bloom.strength=THREE.MathUtils.lerp(bloom.strength,3.2,.02);

    const show=dT>.8&&dT<5.;
    narr('ACT IV · TRANSCENDENCE','离 · 升 华','物我两忘 · 身心清朗 · 归于太虚',show);
    if(show) el.prose.textContent='脱离形质 · 化作虚空 · 天地同流';

    // 渐黑淡出
    if(t>=TL.FADE){
      const fp=(t-TL.FADE)/(TL.TOTAL-TL.FADE);
      renderer.toneMappingExposure=Math.max(.001,1.3*(1-fp));
      el.hud.style.opacity=`${1-fp}`;
      el.narr.style.opacity=`${Math.max(0,1-(fp-.45)*2.2)}`;
      if(fp>.75) audio.fade(3.);
    }
    if (t >= TL.TOTAL && isRecording4K && mediaRecorder4K && mediaRecorder4K.state === 'recording') {
      mediaRecorder4K.stop();
    }
  }

  /* ── 镜头震动 + 视差 ── */
  if(recoil>.001){
    camera.position.x+=(Math.random()-.5)*recoil;
    camera.position.y+=(Math.random()-.5)*recoil*.7;
    recoil*=.86;
  }
  mx.x+=( mx.tx-mx.x)*.05; mx.y+=(mx.ty-mx.y)*.05;
  camera.position.x+=mx.x*.28; camera.position.y+=mx.y*.20;
  camera.lookAt(0,0,0);
}

/* ════════════════════════════════════════════════════════════
   §16.5  4K IN-CANVAS HUD COMPOSITOR (FOR 4K VIDEO EXPORT)
════════════════════════════════════════════════════════════ */
let isRecording4K = false;
let mediaRecorder4K = null;
let recChunks4K = [];
let hudCanvas4K = null;
let hudCtx4K = null;
let hudTexture4K = null;
let hudScene4K = null;
let hudCamera4K = null;

function init4KHudCompositor() {
  if (hudScene4K) return;
  hudCanvas4K = document.createElement('canvas');
  hudCanvas4K.width = 3840;
  hudCanvas4K.height = 2160;
  hudCtx4K = hudCanvas4K.getContext('2d');

  hudTexture4K = new THREE.CanvasTexture(hudCanvas4K);
  hudTexture4K.minFilter = THREE.LinearFilter;
  hudTexture4K.magFilter = THREE.LinearFilter;

  hudScene4K = new THREE.Scene();
  hudCamera4K = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quadMat = new THREE.MeshBasicMaterial({ map: hudTexture4K, transparent: true });
  const quadGeo = new THREE.PlaneGeometry(2, 2);
  const quadMesh = new THREE.Mesh(quadGeo, quadMat);
  hudScene4K.add(quadMesh);
}

function drawSpacedText4K(ctx, text, x, y, spacing, align) {
  if (!text) return;
  if ('letterSpacing' in ctx) {
    ctx.letterSpacing = spacing + 'px';
    ctx.textAlign = align;
    ctx.fillText(text, x, y);
    ctx.letterSpacing = '0px';
    return;
  }
  const chars = Array.from(text);
  const widths = chars.map(c => ctx.measureText(c).width);
  const totalW = widths.reduce((a, b) => a + b, 0) + (chars.length - 1) * spacing;
  let curX = align === 'center' ? x - totalW * 0.5 : (align === 'right' ? x - totalW : x);
  ctx.textAlign = 'left';
  for (let i = 0; i < chars.length; i++) {
    ctx.fillText(chars[i], curX, y);
    curX += widths[i] + spacing;
  }
}

function render4KHudFrame(t) {
  if (!isRecording4K || !hudCtx4K) return;
  const W = 3840, H = 2160;
  hudCtx4K.clearRect(0, 0, W, H);

  // 1. 2.39:1 电影宽银幕上下遮幅
  const barH = Math.round(H * 0.08);
  hudCtx4K.fillStyle = '#000000';
  hudCtx4K.fillRect(0, 0, W, barH);
  hudCtx4K.fillRect(0, H - barH, W, barH);

  hudCtx4K.strokeStyle = 'rgba(255, 255, 255, 0.12)';
  hudCtx4K.lineWidth = 1.5;
  hudCtx4K.beginPath();
  hudCtx4K.moveTo(0, barH); hudCtx4K.lineTo(W, barH);
  hudCtx4K.moveTo(0, H - barH); hudCtx4K.lineTo(W, H - barH);
  hudCtx4K.stroke();

  // 2. 顶部 HUD
  const topPadY = Math.round(barH * 0.52);
  hudCtx4K.font = '700 24px "Cinzel", serif';
  hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.9)';
  hudCtx4K.textAlign = 'left';
  hudCtx4K.textBaseline = 'middle';
  drawSpacedText4K(hudCtx4K, '断 · 舍 · 离', 120, topPadY, 12, 'left');

  hudCtx4K.font = '600 20px "Space Mono", monospace';
  hudCtx4K.fillStyle = 'rgba(0, 240, 255, 0.8)';
  drawSpacedText4K(hudCtx4K, 'PIPELINE: 4K UHD MASTER (3840×2160)', 340, topPadY, 6, 'left');

  // 时间码
  const s = Math.min(t, 30).toFixed(2).padStart(5, '0');
  hudCtx4K.textAlign = 'right';
  hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.75)';
  hudCtx4K.font = '600 22px "Space Mono", monospace';
  drawSpacedText4K(hudCtx4K, `${s} / 30.00`, W - 120, topPadY, 6, 'right');

  // 3. 底部 HUD 诗意哲理句与进度条
  const botPadY = H - Math.round(barH * 0.48);
  hudCtx4K.font = '200 24px "Noto Serif SC", serif';
  hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.65)';
  hudCtx4K.textAlign = 'left';
  hudCtx4K.textBaseline = 'middle';
  if (el.prose && el.prose.textContent) {
    drawSpacedText4K(hudCtx4K, el.prose.textContent, 120, botPadY, 14, 'left');
  }

  // 底部进度条
  const progW = Math.min(1.0, Math.max(0, t / TL.TOTAL)) * W;
  hudCtx4K.fillStyle = 'rgba(0, 240, 255, 0.7)';
  hudCtx4K.fillRect(0, H - 3, progW, 3);

  // 4. 居中文案渲染 (完全镜像上一版优雅居中、超宽字距与微柔辉光)
  if (el.narr && el.narr.classList.contains('on') && el.nt && el.nt.textContent) {
    const centerY = Math.round(H * 0.48);
    hudCtx4K.save();
    hudCtx4K.textBaseline = 'middle';

    // 幕次 Tag (ACT I · THE COCOON)
    if (el.na && el.na.textContent) {
      hudCtx4K.font = '500 24px "Space Mono", monospace';
      hudCtx4K.fillStyle = '#00f0ff';
      hudCtx4K.shadowColor = 'rgba(0, 240, 255, 0.5)';
      hudCtx4K.shadowBlur = 24;
      drawSpacedText4K(hudCtx4K, el.na.textContent, W * 0.5, centerY - 80, 22, 'center');
    }

    // 核心大字标题 ("执 · 囚 笼")
    hudCtx4K.font = '200 96px "Noto Serif SC", serif';
    hudCtx4K.fillStyle = '#ffffff';
    hudCtx4K.shadowColor = 'rgba(255, 255, 255, 0.45)';
    hudCtx4K.shadowBlur = 55;
    drawSpacedText4K(hudCtx4K, el.nt.textContent, W * 0.5, centerY, 68, 'center');

    // 底部副描述 ("万物附骨 · 禁锢重压 · 窒息坍缩")
    if (el.nd && el.nd.textContent) {
      hudCtx4K.font = '300 26px "Noto Serif SC", serif';
      hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.55)';
      hudCtx4K.shadowColor = 'rgba(0, 0, 0, 0.8)';
      hudCtx4K.shadowBlur = 12;
      drawSpacedText4K(hudCtx4K, el.nd.textContent, W * 0.5, centerY + 82, 16, 'center');
    }

    hudCtx4K.restore();
  }

  // 5. 尾声屏 (EPILOGUE)
  if ((el.epi && el.epi.classList.contains('on')) || t >= 27.5) {
    const centerY = Math.round(H * 0.48);
    hudCtx4K.save();
    hudCtx4K.textBaseline = 'middle';

    hudCtx4K.font = '200 130px "Noto Serif SC", serif';
    hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.95)';
    hudCtx4K.shadowColor = 'rgba(255, 255, 255, 0.35)';
    hudCtx4K.shadowBlur = 75;
    drawSpacedText4K(hudCtx4K, '断 舍 离', W * 0.5, centerY - 25, 120, 'center');

    hudCtx4K.font = '200 28px "Noto Serif SC", serif';
    hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.45)';
    hudCtx4K.shadowColor = 'rgba(0, 0, 0, 0.9)';
    hudCtx4K.shadowBlur = 16;
    drawSpacedText4K(hudCtx4K, '一物不留 · 一念不执 · 归于太虚', W * 0.5, centerY + 75, 24, 'center');

    hudCtx4K.font = '400 18px "Space Mono", monospace';
    hudCtx4K.fillStyle = 'rgba(255, 255, 255, 0.25)';
    drawSpacedText4K(hudCtx4K, 'EVERYTHING RELEASED · NOTHING REMAINS', W * 0.5, centerY + 130, 10, 'center');

    hudCtx4K.restore();
  }

  hudTexture4K.needsUpdate = true;
}

/* ════════════════════════════════════════════════════════════
   §17  RENDER LOOP
════════════════════════════════════════════════════════════ */
const clock=new THREE.Clock();

function loop(){
  requestAnimationFrame(loop);
  const dt=clock.getDelta(), el2=clock.getElapsedTime();

  // 后处理 uniform
  film.uniforms.uTime.value=el2;
  plasmaUniforms.uT.value=el2;

  // AnimationMixer
  if(mixer) mixer.update(dt);

  // 核心光呼吸
  coreLight.intensity=coreLight.intensity*(1+(Math.sin(el2*1.6)*.02));

  // 等离子球自转
  if(singCore) singCore.rotation.y+=.006;

  // 天球仪持续微转（待机时）
  astroRings.forEach(r=>{ r.rotation.y+=.004; });

  // 体积光柱旋转
  rayGrp.rotation.y=el2*.07;

  // 星云层慢速旋转
  nebula.rotation.y=el2*.006;
  dust.rotation.y=-el2*.008;
  stars.rotation.y=el2*.001;

  // VU 律动
  const vuT=playing?(el2*3.5):0;
  vuB.forEach((b,i)=>{
    const h=playing?3+Math.abs(Math.sin(vuT*(1+i*.4)+i))*(10+Math.sin(el2*2+i)*3):3;
    b.style.height=`${h}px`;
  });

  /* ── 粒子动力学 ── */
  const pa=disc.geometry.attributes.position.array;
  const isBurst=playing&&(performance.now()-t0)/1000>=TL.A2S;
  const isDiss =playing&&(performance.now()-t0)/1000>=TL.A4S;

  for(let i=0;i<DISC_N;i++){
    const m=discMeta[i];
    if(!isBurst){
      // 吸积盘旋涡坍缩
      m.ang+=m.spd*.032;
      m.r-=.0015; if(m.r<.55) m.r=10.;
      pa[i*3]=Math.cos(m.ang)*m.r;
      pa[i*3+1]=m.y+Math.sin(el2*1.6+m.ang)*.22;
      pa[i*3+2]=Math.sin(m.ang)*m.r;
    } else if(!isDiss){
      // 超新星爆散
      pa[i*3]+=m.bv.x*.013; pa[i*3+1]+=m.bv.y*.013; pa[i*3+2]+=m.bv.z*.013;
    } else {
      // 上升光雨
      pa[i*3+1]+=.068; if(pa[i*3+1]>14) pa[i*3+1]=-8;
    }
  }
  disc.geometry.attributes.position.needsUpdate=true;

  // 时间轴调度
  if(playing){
    const t=(performance.now()-t0)/1000;
    if(t<=TL.TOTAL){ direct(t); }
    else if(!TR.epi){
      TR.epi=true; playing=false;
      el.epi.classList.add('on');
      el.narr.classList.remove('on');
      el.hud.style.opacity='0';
    }
  }

  comp.render();

  if (isRecording4K && hudScene4K) {
    render4KHudFrame(playing ? (performance.now() - t0) / 1000 : 0);
    renderer.autoClear = false;
    renderer.render(hudScene4K, hudCamera4K);
    renderer.autoClear = true;
  }
}
loop();

/* ════════════════════════════════════════════════════════════
   §18  LAUNCH / REPLAY
════════════════════════════════════════════════════════════ */
function launch(is4K = false){
  if (!is4K) isRecording4K = false;
  audio._boot(); audio.act1();
  el.portal.classList.add('gone');
  el.epi.classList.remove('on');
  el.hud.classList.add('on');
  el.sds.classList.add('on');
  el.narr.style.opacity=''; el.hud.style.opacity='1';
  el.flash.style.background='radial-gradient(ellipse at 50% 50%,#fff 0%,#a0f0ff 20%,#001830 60%,#000 100%)';

  // 重置状态
  Object.keys(TR).forEach(k=>TR[k]=false);
  prevAct=-1; recoil=0;
  bloom.strength=1.8; renderer.toneMappingExposure=1.3;
  film.uniforms.uCA.value=.003;
  coreLight.intensity=5.5; coreLight.color.set(0x00f0ff);
  el.lb1.classList.remove('wide'); el.lb2.classList.remove('wide');
  el.stk.classList.remove('on');
  camera.position.set(0,.6,16); camera.fov=36; camera.updateProjectionMatrix();
  aux.intensity=0;
  plasmaUniforms.uCA.value.set(0x00e8ff);
  plasmaUniforms.uCB.value.set(0x0028ff);
  plasmaUniforms.uCC.value.set(0xffffff);
  plasmaUniforms.uInt.value=3.8;

  // 重置程序化资产
  if(cageGrp){
    cageGrp.rotation.set(0,0,0);
    cageGrp.children.forEach(c=>c.visible=true);
  }
  if(sacredGrp) sacredGrp.scale.set(.001,.001,.001);
  if(pillarMat) pillarMat.opacity=0;

  // 碎片归位
  shards.forEach(s=>{
    cageGrp&&!cageGrp.children.includes(s)&&cageGrp.add(s);
    s.position.copy(s.userData.origin);
    const sc=.5; s.scale.set(sc,sc*(1+Math.random()*.8),sc);
  });

  // 触须归零
  tendrilGrp.children.forEach(m=>{ m.material.opacity=0; m.material.color.set(0x00d8ff); });

  // 激波环归零
  [sw1,sw2,sw3].forEach(r=>{ r.scale.set(.001,.001,1); r.material.opacity=0; });

  // 粒子复位
  discMeta.forEach((m,i)=>{
    const ang=Math.random()*Math.PI*2, r=1.8+Math.random()*9.5;
    m.ang=ang; m.r=r; m.y=(Math.random()-.5)*(1.2/(r*.18+1));
    discPos[i*3]=Math.cos(ang)*r; discPos[i*3+1]=m.y; discPos[i*3+2]=Math.sin(ang)*r;
  });
  disc.geometry.attributes.position.needsUpdate=true;

  t0=performance.now(); playing=true;
}

g('btn-go').addEventListener('click', () => launch(false));
g('btn-rp').addEventListener('click', () => launch(false));

async function start4KExport() {
  audio._boot();
  if (audio.ctx && audio.ctx.state === 'suspended') {
    await audio.ctx.resume();
  }
  init4KHudCompositor();
  isRecording4K = true;
  recChunks4K = [];

  // 升频至 3840×2160 原生 4K
  renderer.setSize(3840, 2160, false);
  comp.setSize(3840, 2160);
  bloom.setSize(3840, 2160);
  camera.aspect = 3840 / 2160;
  camera.updateProjectionMatrix();

  // 搭建音画流录制通道
  const mediaDest = audio.ctx.createMediaStreamDestination();
  audio.mst.connect(mediaDest);

  const vTrack = el.cv.captureStream(60).getVideoTracks()[0];
  const aTrack = mediaDest.stream.getAudioTracks()[0];
  const recStream = new MediaStream([vTrack, aTrack]);

  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
    ? 'video/webm;codecs=vp9,opus'
    : 'video/webm';

  mediaRecorder4K = new MediaRecorder(recStream, {
    mimeType: mime,
    videoBitsPerSecond: 50000000,
    audioBitsPerSecond: 320000
  });

  mediaRecorder4K.ondataavailable = e => {
    if (e.data && e.data.size > 0) recChunks4K.push(e.data);
  };

  mediaRecorder4K.onstop = () => {
    const blob = new Blob(recChunks4K, { type: 'video/webm' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = '断舍离_DAN-SHA-RI_4K_UHD_30s.webm';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);

    // 录制结束，平滑恢复屏幕尺寸
    isRecording4K = false;
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
    comp.setSize(w, h);
    bloom.setSize(w, h);
  };

  mediaRecorder4K.start(100);
  launch(true);
}

const recBtn = g('btn-rec4k');
if (recBtn) recBtn.addEventListener('click', start4KExport);
const hud4kBtn = g('btn-hud-4k');
if (hud4kBtn) hud4kBtn.addEventListener('click', start4KExport);

});
